name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [qa]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request for the Angular application:
            - Correctness bugs and edge cases
            - Angular/TypeScript best practices
            - Test coverage for the changes
            - Simplicity and consistency with the existing codebase

            Use `gh pr comment` for the summary at the end.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to leave inline comments on specific lines when relevant.
            Only post GitHub comments - don't just print the review as plain text output.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
