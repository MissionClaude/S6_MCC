name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [qa]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Please review this pull request for the Angular application:
            - Correctness bugs and edge cases
            - Angular/TypeScript best practices
            - Test coverage for the changes
            - Simplicity and consistency with the existing codebase
            Leave inline comments on specific lines when relevant, and a short summary at the end.
